services:
  - type: web
    name: discord-translate-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: AUTO_TRANSLATE_ALL
        value: "true"
      - key: BATCH_DEBOUNCE_MS
        value: "0"
      - key: CONTEXT_MAX_MESSAGES
        value: "4"
      - key: REPLY_TO_MESSAGE
        value: "false"
